# Provisioning des dashboards Grafana
apiVersion: 1

providers:
  - name: CredLens
    orgId: 1
    folder: CredLens
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true