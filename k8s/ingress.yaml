# Ingress HTTPS (OPTIONNEL) — necessite nginx-ingress + cert-manager + un
# ClusterIssuer "cloudflare-origin". Non installe par defaut sur K3s.
# Exposition simple sans composant supplementaire : voir service.yaml (NodePort 30080).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credlens-api
  namespace: credlens
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: "cloudflare-origin"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - credlens-api.example.com
      secretName: credlens-api-tls
  rules:
    - host: credlens-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: credlens-api
                port:
                  number: 80
