# GABARIT documentaire — NON appliqué par scripts/deploy.sh (qui génère des valeurs aléatoires).
# Le déploiement en production (CREDLENS_ENV=production) refuse de démarrer si ces valeurs restent
# celles du gabarit. Création manuelle équivalente :
#   kubectl -n credlens create secret generic credlens-api-secret \
#     --from-literal=jwt=$(openssl rand -hex 32) \
#     --from-literal=client_secret=$(openssl rand -hex 16) \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: credlens-api-secret
  namespace: credlens
type: Opaque
stringData:
  jwt: change-me-in-production
  client_secret: change-me-in-production
